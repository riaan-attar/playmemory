[project]
name = "playmemory"
version = "0.1.0"
description = "Timeline ('video-like') memory layer for AI systems"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
st = ["sentence-transformers"]
onnx = ["onnxruntime", "tokenizers"]
ann = ["faiss-cpu"]
bench = ["faiss-cpu"]
dev = ["pytest"]

[project.scripts]
playmemory = "playmemory.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore:HashEmbedder is a non-semantic"]
