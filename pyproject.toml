[project]
name = "playmemory"
version = "0.1.0"
description = "Timeline ('video-like') memory layer for AI systems"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
st = ["sentence-transformers"]
bench = ["faiss-cpu"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
