[project]
name = "playmemory"
dynamic = ["version"]
description = "Lightweight single-file timeline memory for AI agents: hybrid search, scenes, time travel."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Riaan Attar" }]
keywords = ["llm", "memory", "rag", "agents", "mcp", "embeddings", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
onnx = ["onnxruntime", "tokenizers"]   # local BGE-small embedder, no torch
st = ["sentence-transformers"]
ann = ["faiss-cpu"]                    # HNSW for very large memories
bench = ["faiss-cpu"]
docs = ["pypdf>=4", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
audio = ["faster-whisper"]
ner = ["spacy"]
images = ["sentence-transformers", "pillow"]
all = ["onnxruntime", "tokenizers", "faiss-cpu", "pypdf>=4", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
dev = ["pytest", "build", "twine"]

[project.scripts]
playmemory = "playmemory.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "playmemory.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
playmemory = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore:HashEmbedder is a non-semantic"]
